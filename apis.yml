aid: shiprust
name: ShipRust
image: https://shiprust.com/assets/og-image.png?v=b2dd1faf0277
description: ShipRust provides a Rust-based SaaS starter platform that includes a ready-to-use Axum web framework, Maud templating, PostgreSQL
  integration, authentication, Stripe billing, monitoring, and a full set of developer tools. It enables developers to launch a production-ready
  SaaS application in an afternoon, offering sign‑in, payments, analytics, and extensible codebase for building unlimited Rust web services.
